# One-off: repack the served checkpoint from raw HF safetensors into FTW.
#
# Why this exists. `ft serve` loads raw safetensors through torch's mmap, and an
# mmap page fault is a SINGLE synchronous reader -- the kernel does not issue
# concurrent FUSE reads for one, so every readahead knob measures flat and the
# mount delivers single-stream latency, not its bandwidth. Measured on this
# cluster: 541-1769 ms per read, ~1-16 MiB/s, which is nine hours for a 156 GiB
# model. The same bytes through the client path read at 704-880 MiB/s, and the
# same mount with eight concurrent readers benchmarks at 4763 MiB/s. The mount
# is not slow; the access pattern is the worst one it has.
#
# FTW is the format FreeToken built for this: 4096-aligned, 8 GiB shards, read
# with O_DIRECT 8 MiB `preadv` from a thread pool -- concurrent by construction.
#
# Run it, watch it, delete it:
#   sed 's/MODEL_NAME/dsv4-flash/g' k8s/freetoken-ftw-convert.yaml | kubectl -n autumn apply -f -
#   kubectl -n autumn logs -f job/ftw-convert-dsv4-flash
#   kubectl -n autumn delete job ftw-convert-dsv4-flash
#
# Run one model at a time. The node's root disk saturates at ~180 MiB/s
# aggregate (98% util, measured), and this reads and writes the whole
# checkpoint on it -- two at once would not go faster and would not fit.
apiVersion: batch/v1
kind: Job
metadata:
  name: ftw-convert-MODEL_NAME
  namespace: autumn
  labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: ftw-convert }
spec:
  backoffLimit: 0          # a half-written upload should be looked at, not retried blind
  template:
    metadata:
      labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: ftw-convert }
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: "192.168.3.2"

      initContainers:
        # The freetoken image carries its own `autumnfs`, but it is built at the
        # image's commit and this cluster has moved past it -- it fails the
        # handshake with a bare rkyv decode error. Take the binary from the
        # cluster's own image instead, the way the serving pod takes autumn-fuse.
        - name: tools
          image: dongmao-test-cn-beijing.cr.volces.com/dongmao-test/autumn-rs:c211b626a140ddc43bd101925e3b019c7d0839f9
          command: ["sh","-c","cp /usr/local/bin/autumnfs /tools/ && chmod +x /tools/autumnfs"]
          volumeMounts:
            - { name: tools, mountPath: /tools }
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits:   { cpu: "1", memory: 1Gi }

      containers:
        - name: convert
          image: dongmao-test-cn-beijing.cr.volces.com/dongmao-test/freetoken-l3:3c43c273a485d93903dc45bd6b3a43684f6ba152
          command: ["bash","-lc"]
          args:
            - |
              set -euo pipefail
              SRC=models/MODEL_NAME
              DST=models/MODEL_NAME-ftw
              FS="/tools/autumnfs --credential-file /etc/autumn/cred/fs.cred --transport tcp"

              # The Rust client is IP-only; it does not resolve names.
              M="$(getent hosts autumn-manager | awk '{print $1}'):9001"
              echo "manager = $M"
              FS="$FS --manager $M"

              # Where the two ~150 GiB copies of scratch live. Empty
              # WORK_DEVICE keeps them on the pod's emptyDir, i.e. the node's
              # root disk. A device puts this run on its own spindle instead,
              # so a second conversion is not fighting the first for one disk.
              # The mount lands in THIS container's namespace only; the host's
              # mount table is not touched. Everything we create lives under
              # one subdirectory, which the EXIT trap takes away -- that
              # filesystem holds other people's checkpoints.
              W=/work
              if [ -n "${WORK_DEVICE:-}" ]; then
                mkdir -p /scratch
                mount "$WORK_DEVICE" /scratch
                # Keyed on the SOURCE bucket, not the output name. Two
                # variants of one model (MiniMax-M2.5 and -NVFP4) share a
                # MODEL_NAME, and sharing a scratch dir meant the second run
                # inherited the first's 216 GiB `src` -- which the space it
                # needed was sitting in, and which `find ... config.json` would
                # happily have converted instead.
                W=/scratch/ftw-BUCKET_MODEL
                # Clean up ONLY after a successful run. This used to be a bare
                # EXIT trap, which fires on failure too — and an upload that
                # fails after the repack has finished is precisely when the
                # output is most worth keeping: ~75 minutes of GPU work that a
                # retry could upload in minutes. It has cost that twice now,
                # 131 GiB and 147 GiB.
                trap '[ "${CONVERT_OK:-0}" = 1 ] && rm -rf -- "$W"' EXIT
                # Keep the SOURCE across a failed run, drop a partial OUTPUT.
                #
                # Those are opposite calls because the two legs resume
                # differently: `oniond download` is resumable and the upload
                # skips what is already uploaded, so a kept source saves the
                # whole download. `ft checkpoint` has no resume — no --resume,
                # no --skip-existing, nothing — so it re-runs from zero every
                # time, and a kept partial output is never read: it just sits
                # on the scratch device competing with the run that will
                # overwrite it. After the 128Gi OOM that cost 170 GB of
                # headroom on a device that needs ~270.
                mkdir -p "$W"
                if [ -d "$W/ftw" ]; then
                  echo "dropping $(du -sh "$W/ftw" | cut -f1) of partial output (the converter cannot resume)"
                  rm -rf -- "$W/ftw"
                fi
                echo "scratch: $WORK_DEVICE -> $W"
              fi
              df -h "$W" | tail -1

              # Make the destination FIRST, and prove it exists. This used to
              # sit just before the upload as `mkdir ... || true`, which threw
              # away a complete run: the cluster was mid-split and could not
              # create the directory, the `|| true` swallowed it, and all 23
              # shards then failed `ENOENT` after 40 minutes of download and 34
              # of repack. A destination that cannot be made should cost
              # seconds, so it is checked before anything expensive starts.
              $FS mkdir "$DST" 2>&1 | grep -v "already exists" || true
              $FS ls "$DST" > /dev/null

              # ── fetch ────────────────────────────────────────────────────
              # Straight from the in-network TOS bucket, not from autumn. The
              # source no longer has to be staged in the cluster first: this is
              # the conversion INPUT and nothing else reads it, so a round trip
              # through autumn only bought a second copy to keep consistent.
              #
              # oniond, not HuggingFace: measured 180 MiB/s vs ~22 MiB/s, and
              # HF died mid-transfer twice. `HF_ENDPOINT=hf-mirror` only
              # redirects metadata; the blobs still come from a US CDN.
              # oniond needs jq, which this image lacks — and a bare
              # `apt-get update` returns non-zero on a stale CUDA index, so the
              # `|| true` is load-bearing or the install is silently skipped.
              (apt-get update -qq >/dev/null 2>&1 || true)
              command -v jq >/dev/null || apt-get install -y -qq jq >/dev/null 2>&1
              command -v jq >/dev/null || { echo "jq missing; oniond cannot run"; exit 1; }

              # The expert quantization, checked against the providers this FreeToken
              # build actually has, BEFORE the download. A MiniMax-M2.5 run reached
              # `load_expert_banks` after fetching 216 GiB and died on
              #   ValueError: no expert-bank provider for expert_quant='fp8'
              # The answer was one HTTP GET away: `detect_expert_quant` reads
              # `quant_algo`/`quant_method` out of config.json, and the whole verdict
              # is decidable from that file alone.
              CFG_ID="HF_REPO_ID"
              if [ "$CFG_ID" != "HF_""REPO_ID" ]; then
                curl -sfL "https://hf-mirror.com/$CFG_ID/resolve/main/config.json" -o /tmp/cfg.json \
                  || { echo "cannot read config.json for $CFG_ID"; exit 1; }
                python3 <<'PYEOF' || { echo "expert-quant precheck FAILED"; exit 1; }
              import json, sys
              q = json.load(open("/tmp/cfg.json")).get("quantization_config") or {}
              algo = q.get("quant_algo") or q.get("quant_method")
              fmt = str(q.get("format") or "").lower()
              if algo is None:
                  eq = "none"
              elif "fp4" in str(algo).lower() or "nvfp4" in fmt:
                  eq = "nvfp4"
              else:
                  eq = str(algo).lower()
              known = {"ds_fp4", "none", "nvfp4", "q4_0"}
              print("expert_quant =", eq)
              if eq not in known:
                  print("NOT a provider this build has %s; ft checkpoint will refuse it" % sorted(known))
                  sys.exit(1)
              print("expert-quant precheck OK")
              PYEOF
              fi

              # Free space, against what THIS model needs: the source plus the FTW
              # output, both of them full copies, plus slack. `oniond inspect`
              # answers in bytes and costs one round trip, while running out of room
              # costs the download. A NVFP4 run started with 226 GiB free against the
              # ~280 it needed, and nothing in the script knew.
              NEED_B=$(oniond inspect model "BUCKET_MODEL" 2>/dev/null | grep -i "Used Storage" | grep -oE "[0-9]+" | head -1)
              if [ -n "$NEED_B" ]; then
                need_g=$(( NEED_B / 1024 / 1024 / 1024 * 22 / 10 ))   # source + output + 10%
                free_g=$(df -BG --output=avail "$W" | tail -1 | tr -dc 0-9)
                echo "space: ${free_g}G free, ~${need_g}G needed for BUCKET_MODEL"
                [ "${free_g:-0}" -ge "$need_g" ] || { echo "not enough room on the scratch device"; df -h "$W"; exit 1; }
              fi

              mkdir -p "$W/src"
              echo "downloading BUCKET_MODEL from the bucket"
              time oniond download model "BUCKET_MODEL" --dir "$W/src" --turbo
              echo "source files: $(find "$W/src" -type f | wc -l)"
              du -sh "$W/src"

              # ── convert ──────────────────────────────────────────────────
              # offload: experts are repacked into banks, which is what
              # --moe-backend hybrid consumes at serve time.
              # oniond may land the repo one directory deep; point the
              # converter at whatever actually holds config.json.
              # Take the SHALLOWEST config.json, not the first one `find`
              # happens to return: a DeepSeek-V4 repo also ships
              # `inference/config.json`, which is its ModelArgs file, not an HF
              # model config — pointing the converter at it fails with
              # "Unrecognized model ... should have a model_type key".
              # Take the shallowest NON-EMPTY config.json.
              #
              # Two traps, one per model seen so far. A DeepSeek-V4 repo ships
              # `inference/config.json` — its ModelArgs, not an HF config — so
              # "the first one find returns" is wrong. And oniond lays some
              # repos out at BOTH levels: MiniMax-M2.5 arrived with a tree of
              # zero-byte placeholders at the top (config.json, README.md,
              # chat_template.jinja …) and the real 216 GiB one directory down,
              # so "the shallowest" is wrong too — it picks the empty shell and
              # the converter dies with "not a valid JSON file".
              # Non-empty plus shallowest is what actually identifies it.
              SRCDIR=""
              for c in $(find "$W/src" -maxdepth 3 -name config.json -size +0c -printf '%d %p\n' \
                         | sort -n | cut -d' ' -f2-); do
                SRCDIR="$(dirname "$c")"; break
              done
              [ -n "$SRCDIR" ] || { echo "no non-empty config.json under $W/src"; exit 1; }
              echo "converting from $SRCDIR"
              time ft checkpoint --model "$SRCDIR" --out "$W/ftw" \
                --moe-backend offload --shard-gib 8
              du -sh "$W/ftw"

              # ── upload ───────────────────────────────────────────────────
              # `put` takes one file at a time; the parent was made and checked
              # at the top, before any of this was paid for.
              #
              # Walk, do not `ls`: the converter copies the source's non-weight
              # files into the output, and since the fetch became recursive that
              # includes its SUBDIRECTORIES (inference/, encoding/). `put` on a
              # directory fails "Is a directory" — after the repack is already
              # paid for.
              #
              # Skip what is already uploaded. A previous attempt that died
              # part-way leaves shards behind and `put` refuses to overwrite,
              # so without this every retry of a partly-uploaded model fails on
              # the files that actually succeeded last time.
              # Both sides must be walked the SAME way. `ls` is not recursive,
              # so a flat listing against a recursive `find` reports every
              # already-uploaded file under encoding/ or inference/ as missing,
              # and each retry re-`put`s them for a guaranteed "destination
              # already exists" -- the exact failure this skip is here to avoid.
              (cd "$W/ftw" && find . -type f -printf "%P\n" | sort) > "$W/want.txt"
              dst_walk() {
                $FS ls "$DST/$1" 2>/dev/null | while read -r e; do
                  case "$e" in
                    */) dst_walk "$1${e}" ;;
                    *)  echo "$1$e" ;;
                  esac
                done
              }
              dst_walk "" | sort > "$W/have.txt" || : > "$W/have.txt"
              comm -23 "$W/want.txt" "$W/have.txt" > "$W/todo.txt"
              echo "upload: $(wc -l < "$W/todo.txt") of $(wc -l < "$W/want.txt") files"
              # Directories must exist before the parallel put lands in them.
              sed -n 's#/[^/]*$##p' "$W/todo.txt" | sort -u | while read -r d; do
                [ -n "$d" ] && $FS mkdir "$DST/$d" 2>/dev/null || true
              done
              # `|| true`, and the loop re-checks instead of trusting one pass.
              #
              # xargs exits 123 when ANY invocation failed, and under `set -e`
              # that killed PID 1 — which ended the container, which deleted the
              # emptyDir holding the finished repack. One failed file cost the
              # whole 147 GiB. The output is expensive and the destination is
              # not: a failure here must leave the bytes on disk and let a retry
              # upload only what is missing.
              for attempt in 1 2 3; do
                remaining=$(wc -l < "$W/todo.txt")
                [ "$remaining" -eq 0 ] && break
                echo "upload attempt $attempt: $remaining file(s)"
                time (cd "$W/ftw" && xargs -a "$W/todo.txt" -P 12 -I{} \
                  sh -c "$FS put '{}' '$DST/{}' >/dev/null 2>&1 || echo FAIL {}") || true
                dst_walk "" | sort > "$W/have.txt" || : > "$W/have.txt"
                comm -23 "$W/want.txt" "$W/have.txt" > "$W/todo.txt"
              done

              left=$(wc -l < "$W/todo.txt")
              echo "--- uploaded: $(wc -l < "$W/have.txt") of $(wc -l < "$W/want.txt"), $left missing ---"
              if [ "$left" -ne 0 ]; then
                echo "INCOMPLETE: $left file(s) still missing — the repack is KEPT at $W"
                echo "retry by re-running the upload loop in this pod; do not delete it"
                sleep infinity
              fi
              export CONVERT_OK=1
              echo "DONE: $DST"
          env:
            # The conversion repacks on a GPU; without this it grabs the first
            # visible device, which on this node is one the serving pod owns.
            - { name: CUDA_DEVICE_ORDER, value: "PCI_BUS_ID" }
            - { name: WORK_DEVICE, value: "WORK_DEVICE_VALUE" }
          securityContext:
            # Only so the script can `mount` WORK_DEVICE, and only into this
            # container's own namespace. Drop it if you never set that.
            privileged: true
          resources:
            requests:
              cpu: "8"
              # 128Gi OOM-killed the repack at 81% of the expert banks (117 of
              # 143 GB). `ft checkpoint` loads experts in PARALLEL when the
              # source is on local disk -- the old flow fetched file-by-file
              # from autumn, which kept the peak down by accident. The node has
              # 687Gi allocatable and sits at 35%, so give the peak room rather
              # than forcing serial loading, which is much slower.
              memory: 256Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "8"
              memory: 256Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: tools, mountPath: /tools }
            - { name: cred, mountPath: /etc/autumn/cred, readOnly: true }
            - { name: dshm, mountPath: /dev/shm }

      volumes:
        # Source + output live side by side: ~156 GiB in, ~156 GiB out, against
        # the ~690 GiB free on this node. emptyDir, because nothing here has to
        # survive the job -- the result goes to the cluster.
        - { name: work, emptyDir: {} }
        - { name: tools, emptyDir: {} }
        - name: cred
          secret: { secretName: autumn-credential }
        - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 8Gi } }
