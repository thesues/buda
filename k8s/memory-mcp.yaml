# ⚠️ IMAGE_AUTUMN_RS needs the autumn-rs image tag the cluster is running.
#
# memory-mcp over the documents stored in autumn.
#
# The two namespaces play different roles here and it is worth being explicit:
# the DOCUMENTS live in `fs/` and are read through a FUSE mount, because
# memory-mcp ingests from a filesystem path (`--docs`, and the MCP
# `ingest_documents` tool takes a server-side path, not content). The INDEX it
# builds — BM25 postings, IVF vectors, the CONTAINS outline graph — is written
# to `mem/`. So this pod reads fs/ and writes mem/, and needs a credential for
# each.
#
# Corpus: `fs/docs/buda/` (17 Chinese Buddhist texts, ~2.1M chars, 5164 chunks
# when ingested locally). `--no-index` skips the Rust source indexer — there is
# no code tree in this pod and the docs corpus is the whole point.
---
apiVersion: v1
kind: Service
metadata:
  name: memory-mcp
  namespace: autumn
  labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: memory-mcp }
spec:
  # ClusterIP: the HTTP surface is read-only but unauthenticated, same posture
  # as the dashboard. Reach it with `kubectl port-forward`.
  type: ClusterIP
  selector: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: memory-mcp }
  ports:
    - { name: http, port: 5100, targetPort: 5100 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-mcp
  namespace: autumn
  labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: memory-mcp }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: memory-mcp }
  template:
    metadata:
      labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: memory-mcp }
    spec:
      enableServiceLinks: false
      nodeSelector: { autumn-node: "true" }

      # ── One container, not a fuse sidecar ────────────────────────────────
      # The sidecar shape does not work on this cluster. `mountPropagation:
      # Bidirectional` is accepted by the API server but the node never honours
      # it: measured inside a privileged sidecar, the container had ZERO shared
      # mounts and the FUSE mount came up `PROPAGATION: private` with the
      # container root as its parent. Nothing propagates, so the app container
      # saw an empty directory and died on "No such file or directory".
      #
      # Running the mount in the SAME container sidesteps propagation entirely —
      # one mount namespace, no sharing required. This is the shape the earlier
      # O_DIRECT probe used, and it worked.
      #
      # The cost is honest: the whole container is privileged now, where before
      # only the sidecar was. Reverting to a sidecar requires the node's kubelet
      # to be configured with rshared propagation, which is a cluster-level
      # change on shared infrastructure.
      containers:
        - name: memory-mcp
          image: IMAGE_AUTUMN_RS
          securityContext: { privileged: true }
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              # IP-only client: resolve the manager before dialing it.
              M="$(getent hosts autumn-manager | awk '{print $1}'):9001"
              MP=/mnt/autumn
              mkdir -p "$MP"

              # A crashed predecessor can leave the mount entry behind; clear it
              # before remounting or fusermount fails with EBUSY.
              mountpoint -q "$MP" && fusermount3 -u "$MP" || true

              autumn-fuse --manager "$M" --mountpoint "$MP" --transport tcp \
                --credential-file /etc/autumn/cred/fs.cred &
              FUSE_PID=$!
              trap 'kill $FUSE_PID 2>/dev/null; fusermount3 -u "$MP" 2>/dev/null' EXIT

              for i in $(seq 1 60); do
                mountpoint -q "$MP" && break
                kill -0 $FUSE_PID 2>/dev/null || { echo "autumn-fuse exited during mount"; exit 1; }
                sleep 1
              done
              mountpoint -q "$MP" || { echo "mount timed out after 60s"; exit 1; }
              echo "mounted; corpus:"; ls "$MP/docs/buda" | head -5

              exec memory-mcp "$M" \
                --no-index \
                --docs "$MP/docs/buda" \
                --tenant buda \
                --credential-file /etc/autumn/cred/mem.cred \
                --host 0.0.0.0 --port 5100
          ports:
            - { name: http, containerPort: 5100 }
          volumeMounts:
            - { name: cred, mountPath: /etc/autumn/cred, readOnly: true }
          resources:
            requests: { cpu: "2", memory: 4Gi }
            limits:   { cpu: "4", memory: 8Gi }
          startupProbe:
            # Mount, then ingest; the HTTP listener only binds once ingest
            # finishes, so this budget has to cover the whole thing.
            #
            # Measured in-cluster: 5164 chunks in 168 s (30.7 chunk/s).
            #
            # It was ~45 min before the BM25 postings were batched — that version
            # paid one round trip per unique term, and CJK unigrams give a
            # Chinese chunk several hundred of them. Batching made the network
            # stop being the limit, so this is now bounded by real work.
            #
            # 10 min is ~3.5x the measured time: enough for a cold cluster or a
            # bigger corpus, while still failing in a useful timeframe. Too
            # small remains the worse error — the kubelet would kill an almost
            # finished ingest and the restart starts from zero.
            httpGet: { path: /stats, port: 5100 }
            periodSeconds: 15
            failureThreshold: 40      # 10 min
          readinessProbe:
            httpGet: { path: /stats, port: 5100 }
            periodSeconds: 15

      volumes:
        - name: cred
          secret: { secretName: autumn-credential }
