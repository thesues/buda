# hermes webui — session management and a chat box.
#
# Note what is NOT here, compared to every other workload in this repo: no
# privileged container, no `autumn-fuse`, no `/dev/fuse`, no autumn credential,
# no mountPropagation. This pod never talks to autumn. It talks to `memory-mcp`
# over HTTP MCP and to `freetoken-l3` over the OpenAI-compatible API, both plain
# ClusterIP Services.
#
# `IMAGE_WEBUI` below is a PLACEHOLDER, not an image. Substitute it before
# applying — `sed "s|IMAGE_WEBUI|<repo>/buda-webui:<sha>|" k8s/webui.yaml |
# kubectl apply -f -`. A raw `kubectl apply` of this file is accepted and then
# leaves the pod in InvalidImageName with the old one already torn down, which
# is how the webui went down once. The same holds for `IMAGE_FREETOKEN_L3` in
# freetoken-l3.yaml.
#
# The practical consequence is that this image is NOT under autumn's WIRE
# lockstep: rolling the cluster to a new wire version does not require
# rebuilding it. That is what the MCP HTTP transport bought.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-webui-data
  namespace: autumn
spec:
  accessModes: [ReadWriteOnce]
  # Named explicitly: this cluster has NO default StorageClass, so an unset
  # class leaves the claim Pending and the pod unschedulable. ebs-ssd rather
  # than a node-local class because sessions must survive the pod moving.
  storageClassName: ebs-ssd
  # Sessions ARE the feature. On an emptyDir every restart would present an
  # empty sidebar, which reads as data loss whether or not anyone calls it that.
  # 10Gi, not the 5Gi this asked for: `ebs-ssd` provisions ESSD_PL0, whose
  # minimum volume size is above 5 GiB. The claim below it is accepted by the
  # API server and then fails in the CSI driver with `InvalidVolumeSize`, so the
  # PVC sits Pending and the pod with it — the smallest bound volume in this
  # cluster is the 10Gi ftcache. Sessions are small; this is a floor, not a
  # sizing decision.
  resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-webui
  namespace: autumn
  labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: webui }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: webui }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-webui
  namespace: autumn
  labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: webui }
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the turn state lives in the process and the
  # session DB is a ReadWriteOnce volume, so two replicas cannot both hold it.
  # A surge-first rollout would deadlock on the PVC.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: webui }
  template:
    metadata:
      labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: webui }
    spec:
      # k8s injects HERMES_WEBUI_PORT=tcp://... style vars for every Service in
      # the namespace, which collide with plain PORT-shaped config.
      enableServiceLinks: false
      containers:
        - name: webui
          image: IMAGE_WEBUI
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail

              # Point hermes at the local model server. Best-effort on purpose:
              # a chat UI that refuses to start because a config key moved is
              # worse than one that starts and reports the model is unset.
              if [ -n "${LLM_BASE_URL:-}" ]; then
                # `model.provider custom` FIRST, and it is not optional: without
                # it hermes resolves a provider on its own, lands on openrouter,
                # and `session/new` fails with a bare "Internal error" whose only
                # trace is an OPENROUTER_API_KEY warning in the ACP child's
                # stderr. Verified locally against 0.16 and 0.17 alike.
                hermes config set model.provider custom || \
                  echo "WARN: could not set model.provider" >&2
                hermes config set model.base_url "$LLM_BASE_URL" || \
                  echo "WARN: could not set model.base_url" >&2
                hermes config set model.default "${LLM_MODEL:-dsv4-flash}" || true
                # FreeToken has no auth; hermes still wants the key to be set.
                hermes config set model.api_key "${LLM_API_KEY:-none}" || true
                # hermes trims and compresses against this number, and an
                # explicit config value outranks the length it probes off the
                # server -- so it has to stay under FreeToken's real ceiling,
                # which counts prompt AND generation against one budget. Left
                # too high, every long conversation ends in "prompt is too
                # long: N tokens > M maximum" after the prefill is already
                # paid for. The gap below the ceiling is the room a reply gets
                # to be written into.
                hermes config set model.context_length \
                  "${LLM_CONTEXT_LENGTH:-54000}" || true
              fi

              # The Wan2.2 video provider and the skill that drives it.
              #
              # They live in the IMAGE and are synced into HERMES_HOME at every
              # start, rather than being copied into the PVC once by hand.
              # HERMES_HOME is a PVC, so a hand-copy would survive -- and would
              # then be a version of the plugin that no commit describes, which
              # is how the last config drifted. `hermes_cli.plugins` looks for
              # user plugins at `get_hermes_home()/plugins/<name>/`, needing a
              # plugin.yaml and an `__init__.py` with `register(ctx)`.
              #
              # rsync semantics by hand: replace the directory rather than
              # merging into it, so a file deleted in the repo does not live on
              # in the volume forever.
              for kind in plugins skills; do
                if [ -d "/app/hermes/$kind" ]; then
                  for d in /app/hermes/$kind/*/; do
                    [ -d "$d" ] || continue
                    n="$(basename "$d")"
                    rm -rf "${HERMES_HOME:-/opt/data}/$kind/$n"
                    mkdir -p "${HERMES_HOME:-/opt/data}/$kind"
                    cp -a "$d" "${HERMES_HOME:-/opt/data}/$kind/$n"
                    echo "installed $kind/$n"
                  done
                fi
              done

              # The autumn client is IP-only — it does not resolve names — so
              # the address is resolved here and exported, the same way every
              # other autumn consumer in this cluster does it.
              export AUTUMN_MANAGER="$(getent hosts autumn-manager | awk '{print $1}'):9001"
              echo "autumn manager = $AUTUMN_MANAGER"

              # A user plugin is discovered but NOT loaded unless it is in
              # `plugins.enabled` — discovery logs "Skipping 'wan22' (not in
              # plugins.enabled)" and otherwise says nothing, so the symptom is
              # a model that reports the tool does not exist. Enabling is
              # idempotent.
              hermes plugins enable wan22 || \
                echo "WARN: could not enable the wan22 plugin" >&2

              # Which video backend `video_generate` dispatches to. With a
              # single registered provider hermes would pick it anyway, but
              # naming it means adding a second one later does not silently
              # change which one answers.
              hermes config set video_gen.provider wan22 || \
                echo "WARN: could not select the video provider" >&2

              # hermes' AIAgent refuses any model whose context window is under
              # MINIMUM_CONTEXT_LENGTH = 64_000, a constant in its `agent`
              # package. FreeToken's real ceiling here is 62,080 counting
              # prompt AND generation, so NO value satisfies both that floor
              # and the ceiling: 64000 clears the check and brings straight
              # back the "prompt is too long: N > 62080" failures the 54000
              # above exists to prevent. Lower the floor rather than lie about
              # the window -- the floor is an arbitrary guard, the ceiling is
              # physics.
              #
              # This only appeared with the library path. The ACP subprocess
              # never ran the check, so the same deployment worked until
              # `run_agent.AIAgent` was driven in process.
              MM=$("${HERMES_PY:-/opt/hermes/.venv/bin/python}" -c \
                    'import agent.model_metadata as m; print(m.__file__)' 2>/dev/null)
              if [ -n "$MM" ] && grep -q '^MINIMUM_CONTEXT_LENGTH' "$MM"; then
                sed -i "s/^MINIMUM_CONTEXT_LENGTH = .*/MINIMUM_CONTEXT_LENGTH = ${HERMES_MIN_CONTEXT:-32000}/" "$MM"
                echo "hermes floor: $(grep '^MINIMUM_CONTEXT_LENGTH' "$MM") in $MM"
              else
                echo "WARN: MINIMUM_CONTEXT_LENGTH not found; a short-context model will be refused" >&2
              fi

              # The MCP server is written by the app at startup, not here: it
              # merges into config.yaml idempotently and reports what it did on
              # /api/status, so there is one owner of that block.
              #
              # HERMES' interpreter, not the image's. The app imports
              # `run_agent.AIAgent` and drives it in process — there is no
              # `hermes acp` subprocess any more — and that import only resolves
              # inside hermes' venv. Everything the app itself adds is stdlib,
              # so nothing of ours competes with hermes' dependency tree, which
              # is the reason the session-store bridge used to run in a second
              # interpreter; it is gone with the ACP client.
              exec "${HERMES_PY:-/opt/hermes/.venv/bin/python}" main.py
          env:
            - { name: PORT, value: "8080" }
            - { name: HERMES_HOME, value: /opt/data }
            # Match the model, not the agent. The server defaults to 4 because
            # ACP can carry four conversations, and it argues that a fifth
            # queueing at the model beats being refused at the door. On THIS
            # deployment the model behind it is freetoken-l3 with
            # `--max-running-requests 1`, so "queueing at the model" is what a
            # reader sees as a second conversation that says it is replying and
            # then produces nothing for as long as the first one runs -- while
            # its composer stays enabled, because the composer is gated on the
            # server's limit and the server had room. One is the honest number
            # here: the second turn is refused immediately, and every other
            # conversation greys out while one is answering.
            - { name: MAX_CONCURRENT_TURNS, value: "1" }
            # Every endpoint the picker offers, first one the default. The limit
            # is per entry because the ceiling is the MODEL behind it: one
            # global number can only be right for one of them, and it is the
            # reason MAX_CONCURRENT_TURNS above could only ever describe
            # freetoken-l3. Adding a model is a line here — the agent cache
            # signature carries base_url and provider, so a session that
            # switches misses the cache and is rebuilt against the new one,
            # with no separate switch-model path to keep correct.
            - name: BUDA_ENDPOINTS
              value: |
                [{"key":"dsv4","label":"DSV4-Flash","model":"dsv4-flash",
                  "base_url":"http://freetoken-l3:1919/v1","maxConcurrent":1}]
            # The browser toolset's availability check will DOWNLOAD Chromium
            # to decide it is available -- elsewhere a fresh volume grew from
            # 220 KB to 897 MB doing it. These stop that. They do NOT remove the
            # browser tools themselves: the ACP path hardcodes its toolset (W9).
            - { name: HERMES_NO_DEP_INSTALL, value: "1" }
            - { name: HERMES_DISABLE_LAZY_INSTALLS, value: "1" }
            # Needs the image's patch_acp_toolsets.py; without it this is
            # ignored and the session keeps the full hermes-acp toolset.
            # `mcp-<server>` toolsets are appended after this list, so narrowing
            # it cannot drop retrieval.
            # `video_gen` carries exactly one tool, `video_generate`, and it
            # covers both directions: prompt alone is text-to-video, prompt +
            # image_url is image-to-video, and the active backend routes on
            # that one condition. Without the toolset the tool is never
            # offered, and the model invents a curl instead.
            - { name: HERMES_ACP_TOOLSETS, value: "file,todo,memory,skills,vision,video_gen" }
            # `terminal` is deliberately absent. With a shell in hand the model
            # takes the shortcut -- observed locally reading the corpus with
            # `sed` instead of calling the retrieval server, which also means a
            # local test stops predicting how the pod will behave.
            - { name: WORKDIR, value: /opt/data }
            # The decoupled dependency: an HTTP URL, not a spawned process.
            - { name: MEMORY_MCP_URL, value: "http://memory-mcp:5100/mcp" }
            - { name: MEMORY_MCP_NAME, value: "memory" }
            - { name: LLM_BASE_URL, value: "http://freetoken-l3:1919/v1" }
            - { name: LLM_MODEL, value: "dsv4-flash" }
            # FreeToken's max_seq_len is 62080 (prompt + generation, derived
            # from what is left of the 4090 after the MoE slot cache), so this
            # leaves ~8k for the reply. Raise it only together with the KV
            # budget on the FreeToken side.
            - { name: LLM_CONTEXT_LENGTH, value: "54000" }
            # What this deployment is for. Appended to a session's first prompt.
            # Left unset it falls back to the same text in server.py; set it here
            # to change the agent's brief without rebuilding the image.
            - name: CHAT_DIRECTIVE
              value: |
                你是佛教典籍的检索助手，工作是从已索引的语料库中找出依据来回答问题。
                - 凡涉及经文内容的问题，先用语料库工具检索，不要凭记忆作答。
                - 回答时给出经名与原文引文，并标出出处（文件 › 标题路径 › 行号）。
                - 语料库里没有的，直说没有；可以补充常识背景，但要注明那不是来自语料库。
                - 简明作答，通常几段以内。除非明确要求，不要写长文、不要综述式铺陈。
            # Single-user HTTP Basic, currently OFF: the `hermes-webui-auth`
            # secret does not exist, `optional: true` leaves both unset, and an
            # empty AUTH_USER bypasses the check on every path. Kept wired so
            # turning it on is `kubectl create secret` plus a restart, not an
            # edit here. The app refuses to start with a user set and an empty
            # password rather than running with a credential that can never
            # match, so a half-created secret fails loudly.
            - name: AUTH_USER
              valueFrom:
                secretKeyRef: { name: hermes-webui-auth, key: user, optional: true }
            - name: AUTH_PASS
              valueFrom:
                secretKeyRef: { name: hermes-webui-auth, key: pass, optional: true }
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: data, mountPath: /opt/data }
            - { name: cred, mountPath: /etc/autumn/cred, readOnly: true }
          resources:
            requests: { cpu: "200m", memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            # /healthz is deliberately shallow — it answers while a turn is
            # running and while `hermes acp` is restarting. A deep probe would
            # restart the pod in exactly the moments this design exists to
            # survive, taking the running turn with it.
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: hermes-webui-data }
        # Media storage talks to autumn directly through the PyO3 client, so
        # this pod now holds an fs credential where it used to hold none.
        - name: cred
          secret: { secretName: autumn-credential }
---
# Published through the cluster's existing Volcengine APIG instance, the same
# one `dataverse`, `rlinf` and the lerobot console go through. The two
# annotations are what bind an Ingress to that instance; `ingressClassName`
# alone is not enough, and without them the rule is accepted and never served.
#
# PREREQUISITE, and it fails silently: that instance carries a namespace
# allow-list, and `autumn` is not on it —
#
#   APIGInstance/gda7u922gbfvc539oufjg-apig-instance
#     spec.ingress.enableAllNamespaces: false
#     spec.ingress.watchNamespaces:     [dataverse, default, rlinf]
#
# An Ingress outside those namespaces is accepted by the API server, shows up
# in `kubectl get ingress`, and is simply never programmed into the gateway.
# There is no event and no status condition to notice. Add `autumn` to that
# list before expecting this to route:
#
#   kubectl patch apiginstance gda7u922gbfvc539oufjg-apig-instance --type=merge \
#     -p '{"spec":{"ingress":{"watchNamespaces":["dataverse","default","rlinf","autumn"]}}}'
#
# Moving the Ingress into a watched namespace instead does not work: an Ingress
# backend must live in the Ingress's own namespace, so the Service would have to
# move too, and a Service cannot select pods in another namespace.
#
# Deliberately unauthenticated (decided 2026-09-04). The `hermes-webui-auth`
# secret is not created, so AUTH_USER is empty and the app serves every path
# without a check — see the AUTH_USER note further down. The mechanism stays in
# place: create that secret and restart to turn Basic auth on later.
#
# What that means concretely, so nobody has to rediscover it: anyone who can
# reach this host can read every session in the sidebar, start turns against
# FreeToken, and query the corpus. There is no TLS either — the APIG serves this
# rule on port 80.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-webui-apig
  namespace: autumn
  labels: { app.kubernetes.io/name: autumn, app.kubernetes.io/component: webui }
  annotations:
    ingress.vke.volcengine.com/apig-instance-name: gda7u922gbfvc539oufjg-apig-instance
    ingress.vke.volcengine.com/loadbalancer-id: gda7u922gbfvc539oufjg
spec:
  ingressClassName: physicalai-apig
  rules:
    - host: buda.apig.local
      http:
        paths:
          # One backend, one prefix. The SSE stream is a plain GET on this same
          # port; nothing here may buffer it, which is why the app sends
          # `X-Accel-Buffering: no` on that response.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes-webui
                port: { number: 8080 }
